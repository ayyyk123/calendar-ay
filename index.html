<!doctype html><html lang='ko'><head><meta charset='UTF-8'><meta name='viewport' content='width=device-width,initial-scale=1,viewport-fit=cover'><meta name='theme-color' content='#ffffff'><title>나만의 캘린더 v1.0</title><link rel='manifest' href='manifest.json'><link rel='stylesheet' href='style.css'></head><body>
<header><div><b>나만의 캘린더</b><small> v1.0</small></div><nav><button id='prev'>‹</button><button id='today'>오늘</button><button id='next'>›</button><strong id='range'></strong></nav><div class='views'><button data-view='week' class='on'>주</button><button data-view='month'>월</button><button data-view='day'>일</button><button data-view='list'>목록</button><button id='settingsBtn'>⚙</button></div></header>
<div class='layout'><aside><section><div class='secHead'><b>캘린더</b><button id='addCal'>＋</button></div><div id='calList'></div></section><section><div class='secHead'><b>매월 고정업무</b><button id='addFixed'>＋</button></div><select id='fixedFilter'></select><div id='fixedList'></div><small class='hint'>업무를 달력 날짜로 드래그하세요.</small></section><section><b>이번 주 업무량</b><div id='weekLoad'></div></section></aside><main id='main'></main></div>
<dialog id='eventDlg'><form method='dialog' id='eventForm'><h3 id='eventTitle'>일정 등록</h3><input type='hidden' id='eid'><label>제목<input id='title' required></label><label>캘린더<select id='cal'></select></label><div class='row'><label>날짜<input type='date' id='date' required></label><label>종료일<input type='date' id='endDate'></label></div><label class='check'><input type='checkbox' id='allDay' checked> 종일 일정</label><div class='row timeRow'><label>시작<input type='time' id='start'></label><label>종료<input type='time' id='end'></label></div><div class='row'><label>예상 소요시간(시간)<input type='number' id='hours' min='0' step='.25' value='1'></label><label>종류<select id='kind'><option value='event'>일정</option><option value='todo'>할 일</option></select></label></div><label>반복<select id='repeat'><option value='none'>없음</option><option value='daily'>매일</option><option value='weekly'>매주</option><option value='monthly'>매월</option><option value='yearly'>매년</option></select></label><label>메모<textarea id='memo'></textarea></label><menu><button type='button' id='deleteEvent' class='danger'>삭제</button><span></span><button value='cancel'>취소</button><button type='submit' id='saveEvent' value='default'>저장</button></menu></form></dialog>
<dialog id='calDlg'><form method='dialog' id='calForm'><h3>캘린더 설정</h3><input type='hidden' id='cid'><label>이름<input id='cname' required></label><label>색상<input type='color' id='ccolor'></label><label>표시 순서<input type='number' id='corder' min='1'></label><label>주 활동시간<select id='cperiod'><option>오전</option><option>오후</option><option>저녁</option><option>종일</option></select></label><label>하루 가용시간<input type='number' id='ccap' min='0' step='.5' value='8'></label><menu><button type='button' id='deleteCal' class='danger'>삭제</button><span></span><button value='cancel'>취소</button><button type='submit' value='default'>저장</button></menu></form></dialog>
<dialog id='fixedDlg'><form method='dialog' id='fixedForm'><h3>고정업무</h3><input type='hidden' id='fid'><label>업무명<input id='fname' required></label><label>캘린더<select id='fcal'></select></label><label>예상 소요시간<input type='number' id='fhours' min='0' step='.25' value='1'></label><label>메모<textarea id='fmemo'></textarea></label><menu><button type='button' id='deleteFixed' class='danger'>삭제</button><span></span><button value='cancel'>취소</button><button type='submit' value='default'>저장</button></menu></form></dialog>
<dialog id='settingsDlg'><form method='dialog'><h3>데이터 / Firebase</h3><p class='hint'>기본은 이 기기에 자동 저장됩니다. Firebase 설정을 입력하면 PC·모바일 실시간 동기화를 사용할 수 있습니다.</p><label>Firebase config (JSON)<textarea id='fbconfig' rows='8' placeholder='{"apiKey":"...","authDomain":"...","projectId":"...", ...}'></textarea></label><label>동기화 문서 ID<input id='syncId' value='my-calendar'></label><p id='syncState' class='hint'></p><menu><button value='cancel'>닫기</button><button type='button' id='connectFb'>Firebase 연결</button></menu></form></dialog>
<script type='module' src='app.js'></script></body></html>
